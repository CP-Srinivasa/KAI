# Repo-only template. Installation and activation are separate operator gates.
# Provider/model selection stays transport-side; KAI route authority stays app/ai.
model_list:
  - model_name: kai-bulk
    litellm_params:
      model: os.environ/KAI_LITELLM_BULK_MODEL
  - model_name: kai-standard
    litellm_params:
      model: os.environ/KAI_LITELLM_STANDARD_MODEL
  - model_name: kai-reasoning
    litellm_params:
      model: os.environ/KAI_LITELLM_REASONING_MODEL
  - model_name: kai-critical
    litellm_params:
      model: os.environ/KAI_LITELLM_CRITICAL_MODEL
  - model_name: kai-stt
    litellm_params:
      model: os.environ/KAI_LITELLM_STT_MODEL
  - model_name: kai-kimi-research
    litellm_params:
      # Role-qualified transport route. The ALIAS is fixed because KAI's route
      # contract refers to it; the MODEL behind it is configuration, exactly
      # like every other route. No provider is bound in the repository.
      model: os.environ/KAI_LITELLM_RESEARCH_MODEL
      # Muss zu `InferenceSettings.route_timeout_seconds["research"]` passen.
      # Beide Zeitgrenzen zaehlen dieselbe Wartezeit, und die KLEINERE gewinnt:
      # stand hier das globale `request_timeout: 30`, brach der Proxy nach 30 s
      # mit HTTP 408 ab, waehrend KAI noch 150 s Geduld hatte. Am 2026-09-11 am
      # Geraet gemessen, zweimal 30,0 s. Ein Drift-Test haelt die beiden Werte
      # zusammen: tests/unit/test_research_route_timeout_agreement.py
      timeout: 180

litellm_settings:
  # KAI/app/ai is the single bounded-retry authority.
  num_retries: 0
  request_timeout: 30
  # KAI writes the canonical artifacts/llm_telemetry.jsonl stream.
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
