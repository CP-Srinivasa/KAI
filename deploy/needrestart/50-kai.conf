# /etc/needrestart/conf.d/50-kai.conf -- KAI-Dienste nie automatisch neu starten.
#
# Warum: Am 25.09.2026 04:33Z hat unattended-upgrades curl/libexpat aktualisiert,
# und needrestart hat daraufhin kai-server, kai-litellm, kai-agent-worker,
# kai-tg-listener, kai-entry-watch, kai-liquidation-stream u. a. neu gestartet --
# mitten im Kapital-Pilot D-281. kai-agent-worker endete dabei mit 'signal' und
# loeste einen OnFailure-Alarm aus. Neustarts der KAI-Dienste gehoeren in den
# Release-Weg (pi_release_deploy.sh), nicht in einen naechtlichen Paket-Hook.
#
# Wirkung: needrestart fuehrt kai-* unter "Service restarts being deferred" und
# startet sie nicht. Die neue Bibliothek wird mit dem naechsten Release-Restart
# geladen. Alle anderen Dienste behandelt needrestart unveraendert.
#
# Installation (root):
#   sudo install -m 0644 -o root -g root deploy/needrestart/50-kai.conf \
#       /etc/needrestart/conf.d/50-kai.conf
#
# needrestart laedt diese Datei per eval; ein Syntaxfehler bricht needrestart ab.
# Deshalb vor der Installation pruefen (siehe deploy/README.md, Abschnitt needrestart).

$nrconf{override_rc}->{qr(^kai-)} = 0;
